<svg width="1284" height="2778" viewBox="0 0 1284 2778" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FDF4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ECFDF5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9FAFB;stop-opacity:1" />
    </linearGradient>
    
    <!-- Logo gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle animation rings -->
    <radialGradient id="ringGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0" />
      <stop offset="70%" style="stop-color:#10B981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1284" height="2778" fill="url(#backgroundGradient)"/>
  
  <!-- Animated rings for depth -->
  <circle cx="642" cy="1200" r="300" fill="url(#ringGradient)" opacity="0.3">
    <animate attributeName="r" values="280;320;280" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="642" cy="1200" r="220" fill="url(#ringGradient)" opacity="0.2">
    <animate attributeName="r" values="200;240;200" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Main logo container -->
  <g transform="translate(642, 1200)">
    <!-- Logo background circle -->
    <circle cx="0" cy="0" r="80" fill="white" opacity="0.9" filter="drop-shadow(0 20px 60px rgba(16, 185, 129, 0.15))"/>
    
    <!-- Brain/Mood icon -->
    <g transform="translate(-28, -28)">
      <!-- Brain outline -->
      <path d="M28 12C28 5.373 22.627 0 16 0S4 5.373 4 16c0 8.837 7.163 16 16 16s16-7.163 16-16z" fill="url(#logoGradient)" opacity="0.1"/>
      
      <!-- Mood meter circles -->
      <circle cx="12" cy="16" r="3" fill="url(#logoGradient)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="16" r="3" fill="url(#logoGradient)">
        <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      </circle>
      <circle cx="16" cy="24" r="2" fill="url(#logoGradient)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
      </circle>
      
      <!-- Central pulse -->
      <circle cx="16" cy="16" r="1.5" fill="#10B981">
        <animate attributeName="r" values="1;2;1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- App name -->
  <text x="642" y="1350" text-anchor="middle" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.02em">
    MoodMeter
  </text>
  
  <!-- Tagline -->
  <text x="642" y="1400" text-anchor="middle" fill="#6B7280" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="500" letter-spacing="0.01em">
    Ruh halinizi takip edin
  </text>
  
  <!-- Loading indicator -->
  <g transform="translate(642, 1500)">
    <circle cx="-20" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="20" cy="0" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
  </g>
  
  <!-- Bottom accent -->
  <g transform="translate(642, 2400)">
    <path d="M-100 20 Q0 -20 100 20" stroke="url(#logoGradient)" stroke-width="2" fill="none" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
